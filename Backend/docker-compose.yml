version: '3.8'

services:

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webdb
      MYSQL_ROOT_HOST: '%'
    ports:
      - "8820:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - web_network


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8830:80"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql_db
    networks:
      - web_network


  backend:
    build: .
    container_name: node_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mysql_db
    networks:
      - web_network


volumes:
  mysql_data:


networks:
  web_network:
    driver: bridge