<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Form</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      width: 420px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .header {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
      color: #4a4a4a;
    }

    .flex {
      display: flex;
      align-items: center;
    }

    .form-input {
      margin-bottom: 18px;
      font-size: 15px;
      color: #444;
    }

    .header-form {
      width: 80px;
      font-weight: 500;
    }

    .form,
    textarea {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }

    textarea {
      width: 100%;
      height: 90px;
      resize: none;
      margin-top: 6px;
    }

    .form:focus,
    textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }

    .gender .flex {
      gap: 15px;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-right: 6px;
      accent-color: #667eea;
    }

    .center {
      text-align: center;
      margin-top: 25px;
    }

    .button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
      box-shadow: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">Register Form</div>

    <div class="flex form-input">
      <div class="header-form">ชื่อ</div>
      <input class="form" name="firstname" type="text">
    </div>

    <div class="flex form-input">
      <div class="header-form">นามสกุล</div>
      <input class="form" name="lastname" type="text">
    </div>

    <div class="flex form-input">
      <div class="header-form">อายุ</div>
      <input class="form" name="age" type="number" min="0" max="100">
    </div>

    <div class="flex gender form-input">
      <div class="header-form">เพศ</div>
      <div class="flex">
        <div><input name="gender" type="radio"> ชาย</div>
        <div><input name="gender" type="radio"> หญิง</div>
        <div><input name="gender" type="radio"> อื่นๆ</div>
      </div>
    </div>

    <div class="form-input">
      งานอดิเรก
      <div><input name="interest" type="checkbox"> อ่านหนังสือ</div>
      <div><input name="interest" type="checkbox"> ดูหนัง</div>
      <div><input name="interest" type="checkbox"> ฟังเพลง</div>
    </div>

    <div class="form-input">
      คำอธิบาย
      <textarea name="description"></textarea>
    </div>

    <div class="center">
      <button class="button">submit</button>
    </div>
  </div>
</body>
</html>
