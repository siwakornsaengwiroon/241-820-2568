<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Form</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: #ffffff;
  width: 420px;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

.header {
  font-size: 26px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 25px;
}

.flex {
  display: flex;
  align-items: center;
}

.form-input {
  margin-bottom: 18px;
}

.header-form {
  width: 100px;
}

.form, textarea {
  flex: 1;
  padding: 8px;
}

.center {
  text-align: center;
}

.button {
  padding: 10px 20px;
  cursor: pointer;
  background: #2196F3;
  color: white;
  border: none;
  border-radius: 6px;
}

.message {
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 15px;
  display: none;
}

.message.success {
  background-color: #4CAF50;
  color: white;
  display: block;
}

.message.danger {
  background-color: #f44336;
  color: white;
  display: block;
}
</style>

</head>
<body>

<div class="container">

<a href="user.html">Go to User management</a>

<div class="header">Register Form</div>

<div class="flex form-input">
<div class="header-form">ชื่อ</div>
<input class="form" name="firstName" type="text">
</div>

<div class="flex form-input">
<div class="header-form">นามสกุล</div>
<input class="form" name="lastName" type="text">
</div>

<div class="flex form-input">
<div class="header-form">อายุ</div>
<input class="form" name="age" type="number">
</div>

<div class="flex form-input">
<div class="header-form">เพศ</div>

<label>
<input name="gender" type="radio" value="ชาย"> ชาย
</label>

<label>
<input name="gender" type="radio" value="หญิง"> หญิง
</label>

<label>
<input name="gender" type="radio" value="อื่นๆ"> อื่นๆ
</label>

</div>

<div class="form-input">
งานอดิเรก

<label>
<input name="interests" type="checkbox" value="อ่านหนังสือ"> อ่านหนังสือ
</label>

<label>
<input name="interests" type="checkbox" value="ดูหนัง"> ดูหนัง
</label>

<label>
<input name="interests" type="checkbox" value="ฟังเพลง"> ฟังเพลง
</label>

</div>

<div class="form-input">
คำอธิบาย
<textarea name="description"></textarea>
</div>

<div id="message" class="message"></div>

<div class="center">
<button type="button" onclick="submitData()" class="button">ส่งข้อมูล</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>

const BASE_URL = "http://localhost:8000"

let mode = "Create"
let selectedId = null

window.onload = async () => {

  const params = new URLSearchParams(window.location.search)
  const id = params.get("id")

  if (id) {

    mode = "Edit"
    selectedId = id

    const response = await axios.get(`${BASE_URL}/users/${id}`)
    const user = response.data

    document.querySelector('input[name="firstName"]').value = user.firstname
    document.querySelector('input[name="lastName"]').value = user.lastname
    document.querySelector('input[name="age"]').value = user.age
    document.querySelector('textarea[name="description"]').value = user.description

    document.querySelectorAll('input[name="gender"]').forEach(g => {
      if (g.value === user.gender) g.checked = true
    })

    const interests = user.interests.split(",")

    document.querySelectorAll('input[name="interests"]').forEach(i => {
      if (interests.includes(i.value)) i.checked = true
    })

  }

}

const validateData = (userData) => {

  let errors = []

  if (!userData.firstName) errors.push("กรุณากรอกชื่อ")
  if (!userData.lastName) errors.push("กรุณากรอกนามสกุล")
  if (!userData.age) errors.push("กรุณากรอกอายุ")
  if (!userData.gender) errors.push("กรุณาเลือกเพศ")
  if (!userData.interests) errors.push("กรุณาเลือกงานอดิเรก")
  if (!userData.description) errors.push("กรุณากรอกคำอธิบาย")

  return errors
}

const submitData = async () => {

  const firstName = document.querySelector('input[name="firstName"]').value.trim()
  const lastName = document.querySelector('input[name="lastName"]').value.trim()
  const age = document.querySelector('input[name="age"]').value
  const genderDOM = document.querySelector('input[name="gender"]:checked')
  const description = document.querySelector('textarea[name="description"]').value.trim()

  const interestDOM = document.querySelectorAll('input[name="interests"]:checked')

  let interests = ""

  interestDOM.forEach((i,index)=>{
    interests += i.value
    if(index !== interestDOM.length-1) interests += ","
  })

  const userData = {
    firstName,
    lastName,
    age,
    gender: genderDOM ? genderDOM.value : "",
    interests,
    description
  }

  const errors = validateData(userData)

  const messageDOM = document.getElementById("message")

  if(errors.length>0){

    let html = "<div>กรุณากรอกข้อมูลให้ครบ</div><ul>"

    errors.forEach(e=>{
      html += `<li>${e}</li>`
    })

    html += "</ul>"

    messageDOM.innerHTML = html
    messageDOM.className = "message danger"

    return
  }

  try{

    let message = ""

    if(mode==="Create"){
      await axios.post(`${BASE_URL}/users`,userData)
      message = "เพิ่มข้อมูลสำเร็จ"
    }else{
      await axios.put(`${BASE_URL}/users/${selectedId}`,userData)
      message = "แก้ไขข้อมูลสำเร็จ"
    }

    messageDOM.innerText = message
    messageDOM.className = "message success"

  }catch(error){

    messageDOM.innerText="เกิดข้อผิดพลาด"
    messageDOM.className="message danger"

  }

}

</script>

</body>
</html>
